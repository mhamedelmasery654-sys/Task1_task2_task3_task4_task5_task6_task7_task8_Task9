$kind: http-request
method: POST
url: '{{baseUrl}}/auth/register'
order: 1000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "johndoe",
      "email": "john@example.com",
      "password": "Secret1"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (res.accessToken) {
        pm.collectionVariables.set('accessToken', res.accessToken);
      }
      if (res.user && res.user.id) {
        pm.collectionVariables.set('userId', res.user.id);
      }
